        <!-- Search Box Layout -->
        <div class="search-overlay">
            <div class="d-table">
                <div class="d-table-cell">
                    <div class="search-overlay-layer"></div>
                    <div class="search-overlay-layer"></div>
                    <div class="search-overlay-layer"></div>
                    
                    <div class="search-overlay-close">
                        <span class="search-overlay-close-line"></span>
                        <span class="search-overlay-close-line"></span>

                    <div class="search-overlay-form">

                    <h2>Courses</h2>

        <!-- Start Courses Details Area -->

                            <div class="courses-title">
                                <h2 id="course-title"></h2>
                                <p id="course-subtitle"></p>
                            </div>

                            <div class="courses-meta">
                                <ul>

                                        <a href="#" id="course-category"></a>
                                    </li>
                                    <li>
                                        <i class='bx bx-book'></i>
                                        <span>Lession</span>
                                        <a href="#" id="course-lessons"></a>
                                    </li>
                                    <li>
                                        <i class='bx bx-group'></i>
                                        <span>Students</span>
                                        <a href="#" id="course-students"></a>
                                    </li>
                                    <li>
                                        <i class='bx bx-calendar'></i>
                                        <span>Duration</span>
                                        <a href="#" id="course-duration"></a>
                                    </li>
                                </ul>
                            </div>
                        </div>

                        <div class="col-lg-4">
                            <div class="courses-price">
                                <div class="courses-review">
                                    <div class="review-stars">

                                        <i class='bx bxs-star'></i>
                                        <i class='bx bxs-star'></i>

                            </div>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-lg-8">
                        <div class="courses-details-image text-center">
                            <img id="course-image" src="" alt="image">
                        </div>

                        <div class="courses-details-desc">
                            <h3>About Course</h3>
                            <p id="course-about"></p>
                            <h3>Courses Content</h3>
                            <div class="courses-accordion">
                                <ul class="accordion" id="course-content"></ul>
                            </div>
                            <h3>What you'll learn</h3>
                            <div class="why-you-learn">

                            </div>
                            <h3>Requirements</h3>
                            <ul class="requirements-list px-3" id="course-requirements"></ul>

                        </div>

                    </div>

                    <div class="col-lg-4">
                        <div class="courses-sidebar-information">

                        </div>

                        <div class="courses-sidebar-syllabus exam-overview">

                        <div class="courses-sidebar-syllabus">

                                <div class="tab faq-accordion-tab">

        <!-- Dark version -->

        <!-- Links of JS files -->
        <script src="assets/js/jquery.min.js"></script>
        <script src="assets/js/bootstrap.bundle.min.js"></script>
        <script src="assets/js/owl.carousel.min.js"></script>
        <script src="assets/js/mixitup.min.js"></script>
        <script src="assets/js/parallax.min.js"></script>
        <script src="assets/js/jquery.appear.min.js"></script>
        <script src="assets/js/odometer.min.js"></script>
        <script src="assets/js/particles.min.js"></script>
        <script src="assets/js/meanmenu.min.js"></script>
        <script src="assets/js/jquery.nice-select.min.js"></script>
        <script src="assets/js/viewer.min.js"></script>
        <script src="assets/js/slick.min.js"></script>
        <script src="assets/js/jquery.magnific-popup.min.js"></script>
        <script src="assets/js/jquery.ajaxchimp.min.js"></script>
        <script src="assets/js/form-validator.min.js"></script>
        <script src="assets/js/contact-form-script.js"></script>
        <script src="assets/js/main.js"></script>
        <script src="assets/js/layout.js"></script>
        <script>
function getCourseIdFromUrl() {
    const params = new URLSearchParams(window.location.search);
    return params.get('id');
}

function renderList(list) {
    return list.map(item => `<li>${item}</li>`).join('');
}
function renderListwithTick(list) {
    return list.map(item => `<li><span><i class='bx bx-check'></i>${item}</span></li>`).join('');
}

function renderAccordion(list) {
    return list.map(item => `
        <li class="accordion-item">
            <a class="accordion-title" href="javascript:void(0)">${item}</a>
        </li>
    `).join('');
}

function renderReviews(reviews) {
    return reviews.map(r => `
        <div class="user-review user-review-new">
            <div class="review-rating">
                <div class="review-stars">${'<i class="bx bxs-star"></i>'.repeat(r.rating)}</div>
                <span class="d-inline-block">${r.name}</span>
            </div>
            <span class="d-block sub-comment">${r.subComment || ''}</span>
            <p>${r.comment}</p>
        </div>
    `).join('');
}

function renderSidebar(sidebar) {
    return `
        <li><span><i class='bx bxs-badge-check'></i> Level:</span> ${sidebar.level}</li>
        <li><span><i class='bx bx-video-recording'></i> Type:</span> ${sidebar.type}</li>
        <li><span><i class='bx bx-time'></i> Duration:</span> ${sidebar.sessionDuration}</li>
        <li><span><i class='bx bx-code-alt'></i> Batch Options:</span> ${sidebar.batchOptions}</li>
        <li><span><i class='bx bx-support'></i> Language:</span> ${sidebar.language}</li>
        <li><span><i class='bx bx-certification'></i> Certificate:</span> ${sidebar.certificate}</li>
    `;
}

function renderFAQ(faq) {
    return faq.map(q => `
        <li class="accordion-item">
            <a class="accordion-title" href="javascript:void(0)">
                <i class='bx bx-chevron-down'></i>
                ${q.question}
            </a>
            <div class="accordion-content show"><p>${q.answer}</p></div>
        </li>
    `).join('');
}


$(function() {
    const courseId = getCourseIdFromUrl() || 'cpc-training';
    $.getJSON('assets/js/course-detail-dynamic.json', function(courses) {
        const course = courses.find(c => c.id === courseId);
        if (!course) {
            $('#course-title').text('Course not found');
            window.location.href = 'error-404.html';
            return;
        }
        $('[id=course-title]').text(course.title);
        $('#course-subtitle').text(course.subtitle);
        $('#course-category').text(course.category);
        $('#course-lessons').text(course.lessons);
        $('#course-students').text(course.students);
        $('#course-duration').text(course.duration);
        $('#course-image').attr('src', course.image);
        $('#course-about').text(course.about);
        $('#course-content').html(renderAccordion(course.content));
        $('#course-whatyoulearn').html(renderListwithTick(course.whatYouLearn));
        $('#course-requirements').html(renderList(course.requirements));
        $('#course-audience').html(renderList(course.audience));
        $('#course-reviews').html(renderReviews(course.reviews));
        $('#sidebar-info').html(renderSidebar(course.sidebar));
        if (course.examOverview && course.examOverview.length > 0) {
            $('#exam-overview').html(renderList(course.examOverview));
            $('.exam-overview').show();
        } else {
            $('.exam-overview').hide();
        }
        $('#faq-list').html(renderFAQ(course.faq));
    });
});
</script>
    </body>
</html>
